[project]
name = "options-backtester"
version = "0.1.0"
description = "AI-powered options strategy backtesting system (educational prototype)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "chromadb-client>=0.5",
    "httpx>=0.27",
    "pandas>=3.0.6",
    "numpy>=2.5.4",
    "pyarrow>=26.0.0",
    "python-multipart>=0.0.32",
    "alembic>=1.20.0",
    "pydantic-ai-slim[anthropic,google,groq,openai]>=2.57.0",
    "pypdf>=6.21.1",
    "fastembed>=0.9.0",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=3.0.5.260914",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"otj/*" = ["E501"]
"app/guardrails/*" = ["E501"]  # regex tables are long lines
"app/agents/prompts.py" = ["E501"]
